# Docker Compose Override for Local Development
# This file is automatically merged with compose.yml when running `docker compose up`
# It adds the local Postgres database service for development

services:
  db:
    image: postgres:16-alpine
    container_name: missing-actions-monitoring-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/monitoring?schema=public
      NODE_ENV: development

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL


volumes:
  postgres_data:
